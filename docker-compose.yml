version: '3.8'

services:
  bot:
    build: .
    container_name: telegram-chillskill-info-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
    volumes:
      - ./data:/app/data
      - ./stats.py:/app/stats.py:ro
      - ./usage_log.py:/app/usage_log.py:ro
